feature_id: FEAT-003
title: Refunds and Returns Management
priority: P1
status: planned
source_documents:
  - docs/roadmap.md
  - docs/api/Sales.md
  - docs/api/Receipt.md
summary:
  purpose: Support post-sale service workflows with partial returns, tracked refunds, restocking decisions, and return-specific receipts.
  business_outcomes:
    - allow supervisors and authorized cashiers to process partial item returns without cancelling the full sale
    - preserve accurate stock, tax, and discount reversal on returned items
    - track refund settlement state for cash and non-cash tenders
    - provide clear auditability across transaction history, receipts, and reporting
scope:
  in_scope:
    - return and refund domain entities linked to original sales transactions and line items
    - server-side return preview and finalization workflow for partial and full returns
    - restock, damaged, and discard disposition handling for returned inventory
    - refund settlement tracking for cash, card, and mixed original tenders
    - return receipt generation and transaction history visibility
    - authorization, validation, and audit hooks around return processing
  out_of_scope:
    - direct payment-processor refund execution
    - omnichannel returns across multiple stores before FEAT-008
    - customer self-service returns or external RMA portals
    - exchange-order workflows that create replacement sales in the same transaction
functional_components:
  - id: FC-001
    name: Return eligibility and calculation
    responsibilities:
      - validate that returned quantities do not exceed sold quantities
      - calculate prorated subtotal, discount reversal, tax reversal, and refund total from original line data
      - enforce business rules for non-returnable or already fully returned items
  - id: FC-002
    name: Return authorization and approval
    responsibilities:
      - restrict return creation and refund settlement by role or permission
      - require manager approval for high-value, aged, or no-receipt returns if policy demands it
      - record approval actor, reason, and timestamps in audit trail
  - id: FC-003
    name: Inventory disposition processing
    responsibilities:
      - restock sellable returns into inventory
      - keep damaged or discarded items out of available stock
      - write return-specific inventory movements with transaction and return references
  - id: FC-004
    name: Refund settlement tracking
    responsibilities:
      - capture refund method, settlement status, and reference identifiers
      - support immediate cash refunds and pending manual settlement for non-cash tenders
      - expose refund status in transaction history and return details
  - id: FC-005
    name: Return history and receipt experience
    responsibilities:
      - surface return summary on original transactions
      - expose dedicated return detail and return receipt APIs
      - allow cashier or supervisor workflows from transaction history and receipt screens
current_state_assessment:
  backend:
    observed_files:
      - CrazyPOS.Server/Controllers/SalesController.cs
      - CrazyPOS.Server/Controllers/ReceiptController.cs
      - CrazyPOS.Server/Dto/SalesDto.cs
      - CrazyPOS.Server/Dto/ReceiptDto.cs
      - CrazyPOS.Server/Models/SalesTransaction.cs
      - CrazyPOS.Server/Models/TransactionItem.cs
      - CrazyPOS.Server/Models/PaymentTenderLog.cs
      - CrazyPOS.Server/Models/Inventory.cs
      - CrazyPOS.Server/Models/crazypos_devContext.cs
    existing_capability:
      - CreateTransaction persists completed sales, promotion attribution, and sale inventory movements
      - CancelTransaction performs full-sale reversal only and restores all line quantities in one step
      - ReceiptController renders sale receipts with item and promotion details
      - PaymentTenderLog stores original payment records but no refund settlement lifecycle exists
    gaps:
      - no return, return item, or refund settlement entities
      - no line-level returned quantity tracking on transaction items
      - no server-side preview endpoint for partial refunds
      - no return-specific receipt contract or reporting summary
  frontend:
    observed_files:
      - crazypos.client/src/components/TransactionHistory.jsx
      - crazypos.client/src/components/ReceiptModal.jsx
      - crazypos.client/src/components/PaymentModal.jsx
      - crazypos.client/src/components/Sales.jsx
      - crazypos.client/src/utils/sales.js
      - crazypos.client/src/utils/storage.js
      - crazypos.client/src/App.jsx
    existing_capability:
      - transaction history can filter, export, and open detailed transaction views
      - receipt modal can fetch, print, email, and SMS sale receipts
      - client utilities support transaction creation, lookup, and full cancellation
    gaps:
      - no return action, return detail screen, or refund-settlement UI
      - no return-aware transaction badges, totals, or status filters
      - no return receipt rendering path
      - no frontend test harness is installed yet
technical_considerations:
  - FEAT-001 must be complete first so return and refund actions inherit authenticated, policy-enforced API access.
  - FEAT-002 is already implemented, so refund calculations must reverse persisted discount attribution instead of recalculating from current promotion rules.
  - FEAT-007 is not yet implemented, so card and digital refunds should be tracked as manual or pending settlements rather than processor-executed reversals.
  - CancelTransaction should remain available for full void scenarios; FEAT-003 covers post-sale returns and partial refunds on completed transactions.
  - Return logic must prevent cumulative returned quantity from exceeding the original sold quantity for each transaction item.
  - Inventory updates must separate sellable restocks from damaged or discarded returns to avoid inflating stock on unsellable items.
  - Tax and discount reversal must use deterministic proration rules and consistent rounding on partial quantities.
dependencies:
  feature_dependencies:
    - FEAT-001 Security and Configuration Hardening (required)
    - FEAT-002 Discount and Promotion Engine (required for discounted transaction refunds)
    - FEAT-007 Payment Gateway and Terminal Integration (deferred dependency for automated processor refunds only)
  module_dependencies:
    - sales persistence and transaction reads in CrazyPOS.Server/Controllers/SalesController.cs
    - receipt generation in CrazyPOS.Server/Controllers/ReceiptController.cs and CrazyPOS.Server/Dto/ReceiptDto.cs
    - inventory movement persistence in CrazyPOS.Server/Models/Inventory.cs and POS inventory APIs
    - transaction history and receipt UX in crazypos.client/src/components/TransactionHistory.jsx and crazypos.client/src/components/ReceiptModal.jsx
  permission_dependencies:
    - existing ManagerUp or Admin policy from FEAT-001 for supervisory approval
    - new SALES_RETURN_CREATE permission for starting returns
    - new SALES_RETURN_APPROVE permission for approval-required returns
    - new SALES_REFUND_SETTLE permission for completing non-cash refund settlement updates
  external_libraries:
    backend:
      - name: FluentValidation
        required: optional
        purpose: validate return preview and finalization payloads with reusable business rules
    frontend:
      - name: zod
        required: optional
        purpose: validate return form payloads and settlement updates on the client
      - name: react-hook-form
        required: optional
        purpose: manage complex return item selection and refund settlement forms
    tooling:
      - name: xunit
        required: true
        purpose: backend unit and integration tests
      - name: Microsoft.AspNetCore.Mvc.Testing
        required: true
        purpose: end-to-end API tests for return workflows
      - name: vitest
        required: true
        purpose: frontend unit tests for return state and calculations
      - name: @testing-library/react
        required: true
        purpose: frontend workflow and regression tests
      - name: @testing-library/jest-dom
        required: true
        purpose: frontend DOM assertions
