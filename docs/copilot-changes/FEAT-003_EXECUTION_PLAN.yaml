      path: /api/Return/PreviewReturn
      authorization: authenticated_with_return_permission
      request: ReturnPreviewRequestDto
      response: ReturnPreviewResponseDto
    - method: POST
      path: /api/Return/CreateReturn
      authorization: authenticated_with_return_permission
      request: CreateReturnDto
      response: ReturnDetailDto
    - method: GET
      path: /api/Return/GetReturn
      authorization: authenticated
      request: returnId query parameter
      response: ReturnDetailDto
    - method: GET
      path: /api/Return/GetReturnsByDateRange
      authorization: authenticated
      request: startDate and endDate query parameters
      response: ReturnSummaryDto[]
    - method: POST
      path: /api/Return/UpdateRefundSettlement
      authorization: manager_or_admin_or_refund_settlement_permission
      request: UpdateRefundSettlementDto
      response: RefundSettlementDto
    - method: GET
      path: /api/Receipt/GetReturnReceiptDetails
      authorization: authenticated
      request: returnId query parameter
      response: ReturnReceiptDetailDto
  updated_endpoints:
    - method: GET
      path: /api/Sales/GetTransaction
      change: include return summary, refunded amount, per-line returned quantity, and linked return records
    - method: GET
      path: /api/Sales/GetTransactionsByDateRange
      change: include returnStatus, refundedAmount, and hasOpenRefundSettlement flags for transaction history filters
    - method: POST
      path: /api/Sales/CancelTransaction
      change: explicitly block usage once a partial return exists on the transaction
database_updates:
  schema_changes:
    - table: sales_returns
      columns:
        - return_id bigint pk
        - return_code nvarchar(40) not null unique
        - original_transaction_id bigint not null fk -> sales_transactions
        - customer_id bigint nullable fk -> customers
        - processed_by_user_id bigint not null fk -> users
        - approved_by_user_id bigint nullable fk -> users
        - return_date datetime2 not null
        - status nvarchar(30) not null
        - refund_status nvarchar(30) not null
        - reason_code nvarchar(40) not null
        - reason_notes nvarchar(500) nullable
        - subtotal_reversal decimal(18,2) not null
        - tax_reversal decimal(18,2) not null
        - discount_reversal decimal(18,2) not null
        - refund_total decimal(18,2) not null
        - notes nvarchar(500) nullable
        - created_at datetime2 not null
        - updated_at datetime2 nullable
    - table: return_items
      columns:
        - return_item_id bigint pk
        - return_id bigint not null fk -> sales_returns
        - original_transaction_item_id bigint not null fk -> transaction_items
        - product_id bigint not null fk -> products
        - quantity int not null
        - unit_price decimal(18,2) not null
        - discount_reversal decimal(18,2) not null
        - tax_reversal decimal(18,2) not null
        - refund_line_total decimal(18,2) not null
        - inventory_disposition nvarchar(20) not null
        - disposition_notes nvarchar(300) nullable
        - created_at datetime2 not null
    - table: refund_settlements
      columns:
        - refund_settlement_id bigint pk
        - return_id bigint not null fk -> sales_returns
        - refund_method nvarchar(30) not null
        - amount decimal(18,2) not null
        - settlement_status nvarchar(30) not null
        - payment_reference nvarchar(120) nullable
        - processed_by_user_id bigint nullable fk -> users
        - processed_at datetime2 nullable
        - notes nvarchar(500) nullable
        - created_at datetime2 not null
    - table: sales_transactions
      changes:
        - add refunded_amount decimal(18,2) not null default 0
        - add return_status nvarchar(20) not null default 'none'
    - table: transaction_items
      changes:
        - add returned_quantity int not null default 0
  migration_artifacts:
    - add EF Core migration under CrazyPOS.Server/Database/Migrations
    - add or update SQL rollout scripts under CrazyPOS.Server/Database for controlled deployment environments
