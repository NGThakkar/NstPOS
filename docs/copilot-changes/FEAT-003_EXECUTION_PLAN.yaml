testing_plan:
  unit_tests:
    backend:
      - partial return proration correctly reverses subtotal, discount, and tax from original line data
      - return preview blocks quantities above remaining returnable quantity
      - refund status defaults map correctly for cash, card, and manual settlement methods
      - damaged-item disposition does not restock inventory
    frontend:
      - return modal computes selection state and validation messages correctly
      - transaction history badges render based on returnStatus and refundedAmount
      - receipt modal displays return-specific totals and settlement messaging
  integration_tests:
    - create a completed sale, preview a partial return, and finalize it successfully
    - attempt a second return that exceeds the original sold quantity and expect validation failure
    - create a discounted transaction return and verify discount and tax reversal matches persisted sale data
    - create a return with non-restock disposition and verify product stock remains unchanged
    - verify unauthorized users cannot finalize or settle returns beyond their permission scope
    - verify return receipt endpoint returns the finalized return detail
  end_to_end_uat:
    - cashier or supervisor processes a partial return with one restocked line and one damaged line
    - supervisor records a cash refund and hands back exact tender amount
    - supervisor records a card refund as pending manual settlement and later marks it completed
    - transaction history and printed return receipt show matching refunded totals and statuses
  non_functional_tests:
    - concurrent returns on the same transaction item do not over-credit stock or refund amount
    - migration rollback rehearsal completes on staging
    - transaction history performance remains acceptable with return summary joins enabled
deployment_plan:
  rollout_strategy:
    - step: deploy database migration first with return actions disabled by configuration
    - step: deploy backend return APIs and seed permissions or reason codes
    - step: deploy frontend return workflow to supervisors only for pilot period
    - step: monitor refund totals, inventory adjustments, and settlement backlog for 1 to 2 weeks
    - step: expand access to additional authorized roles after pilot validation
  feature_flags:
    - return_management_enabled
    - return_receipt_enabled
    - refund_settlement_tracking_enabled
  operational_checks:
    - verify permission assignments for return creation, approval, and settlement actions
    - verify stock reconciliation on restocked and damaged-return scenarios
    - verify original transaction detail shows updated refunded amount and return status
    - verify return receipts print and send without breaking existing sale receipt flow
  rollback_plan:
    - disable return-related feature flags immediately
    - stop creating new returns while preserving historical return records
    - revert frontend return entry points behind configuration
    - reconcile inventory and refund settlement records created during the incident window before re-enable
success_metrics:
  functional:
    - no return can exceed original sold quantities or refund more than the original paid amount for returned lines
    - restocked quantities reconcile with inventory movement logs
    - original transaction and return receipt totals stay consistent for audited samples
  business:
    - average supervisor handling time for partial returns
    - count of return operations completed without manual back-office correction
    - refund settlement backlog age for non-cash methods
  quality:
    - zero Sev-1 defects involving stock inflation or refund overpayment during pilot
    - automated test pass rate maintained on backend and frontend suites
agent_execution_hints:
  defaults:
    working_branch_naming: feat/FEAT-003-refunds-returns-management
    commit_pattern: "feat(FEAT-003): <scope>"
  implementation_order_guardrails:
    - do not implement the frontend return workflow until backend preview and create endpoints are stable
    - do not derive refund amounts from current catalog prices or current promotion rules; use persisted sale data only
    - do not restock damaged or discarded returns into sellable inventory
    - do not replace CancelTransaction with return logic; keep void and post-sale return workflows distinct
  done_definition:
    - authorized users can preview and finalize partial returns from completed transactions
    - inventory disposition, refund settlement, and return receipts are persisted and queryable
    - transaction history clearly exposes refunded totals and return status
    - automated tests and staged rollout checklist are complete